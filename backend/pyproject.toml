[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeinsight"
version = "1.0.0"
description = "基于 Hybrid RAG 与 LangGraph 的多语言代码仓库理解工具"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "langgraph>=1,<2",
    "openai>=2,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
codeinsight = "codeinsight.cli.main:main"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codeinsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
