[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeinsight"
version = "1.0.0"
description = "基于 Hybrid RAG 与 LangGraph 的多语言代码仓库理解工具"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "langgraph>=1,<2",
    "openai>=2,<3",
    # Session / Goal / Run 三层状态的 MySQL 持久化（2.0 Step 2）。
    # 用 ORM 而不是手写 SQL 的关键理由是 version_id_col：
    # 它把 stateVersion 的乐观锁做成一等公民，自动生成
    # `UPDATE ... WHERE state_version = ?` 并在 rowcount 为 0 时抛
    # StaleDataError。手写 SQL 也能做，但每张表都要重复一遍且容易漏。
    "sqlalchemy>=2.0,<3",
    # 纯 Python MySQL 驱动。选它而不是 mysqlclient：后者需要本机
    # MySQL C 开发库与编译器，在 Windows 上装不上；CI 里也要多一层系统依赖。
    "pymysql>=1.1,<2",
    # 可选热点缓存；Redis 故障时 SessionService 回源 Memory/Session Store。
    "redis>=6,<7",
    # 本地 Step 4 向量后端；local_json exact 仍保留为回退基线。
    "qdrant-client>=1.15,<1.16",
    # Step 7：Redis-backed Worker、OTel API 和本地 Prometheus 指标端点。
    "celery>=5.5,<6",
    "opentelemetry-api>=1.36,<2",
    "prometheus-client>=0.22,<1",
    "uvicorn[standard]>=0.52.4,<1",
]

[project.scripts]
codeinsight = "codeinsight.cli.main:main"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codeinsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
