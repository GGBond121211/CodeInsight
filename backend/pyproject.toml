[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeinsight"
version = "2.1.0"
description = "基于 Provider Dense/Sparse、Qdrant 与 LangGraph 的多语言代码仓库理解工具"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.116,<1",
    "langgraph>=1.2.11,<2",
    "openai>=2,<3",
    # Session / Goal / Run 三层状态的 MySQL 持久化（2.0 Step 2）。
    # 用 ORM 而不是手写 SQL 的关键理由是 version_id_col：
    # 它把 stateVersion 的乐观锁做成一等公民，自动生成
    # `UPDATE ... WHERE state_version = ?` 并在 rowcount 为 0 时抛
    # StaleDataError。手写 SQL 也能做，但每张表都要重复一遍且容易漏。
    "sqlalchemy>=2.0,<3",
    # 纯 Python MySQL 驱动。选它而不是 mysqlclient：后者需要本机
    # MySQL C 开发库与编译器，在 Windows 上装不上；CI 里也要多一层系统依赖。
    "pymysql>=1.1,<2",
    # 可选热点缓存；Redis 故障时 SessionService 回源 Memory/Session Store。
    "redis>=6,<7",
    # 2.1 运行时唯一向量后端：Qdrant Named Dense/Sparse。
    "qdrant-client>=1.15,<1.16",
    # Step 7：Redis-backed Worker、OTel API 和本地 Prometheus 指标端点。
    "celery>=5.5,<6",
    "opentelemetry-api>=1.36,<2",
    "prometheus-client>=0.22,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
codeinsight = "codeinsight.cli.main:main"

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codeinsight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 2026-09-10 起 explain 只走只读 MCP Tool Loop；2026-09-11 起旧的 LangGraph
# 代码理解路线（agent/workflow.py:run_citation_agent）按用户要求整块注释冻结：
# 源码保留在仓库里作为历史实现，但正常运行时和测试都不再执行它。
# 它原有的单元/集成测试文件同样整块注释，因此默认回归里已经没有任何 legacy
# 用例。下面的 marker 与 addopts 保留，是为了以后回退时有现成的隔离开关。
markers = ["legacy: 已冻结的历史实现，默认不运行"]
addopts = "-m 'not legacy'"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
