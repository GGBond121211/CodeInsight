name: ci

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: uv sync --project backend --locked
      - run: uv run --project backend ruff check backend/src backend/tests
      - run: uv run --project backend python -m pytest --basetemp=work/pytest-ci -q backend/tests

  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose -f ops/docker-compose.yml config
      - run: docker build --file Dockerfile --tag codeinsight-api:ci .

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip-audit -r backend/requirements-audit.txt
        continue-on-error: true
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          ignore-unfixed: true
