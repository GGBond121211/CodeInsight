# CodeInsight 2.0 本地开发依赖。
#
# 当前包含 MySQL、Redis 热点缓存和 Step 4 引入的 Qdrant。Step 9 再补部署用
# API/Gateway/Worker/可观测性编排，不再把 Qdrant 的首次加入推迟到 Step 9。
# 提前用 Compose 而不是先手工装、以后再补，理由是：**开发环境与部署环境从
# 第一天就是同一份配置**。「在我机器上能跑」这个问题从一开始就不存在。
#
# 用法（在仓库根目录）：
#   docker compose up -d mysql        启动
#   docker compose up -d qdrant       启动 Qdrant/HNSW
#   docker compose ps                 看状态与健康检查
#   docker compose logs -f mysql      看日志
#   docker compose logs -f redis      看日志
#   docker compose logs -f qdrant     看日志
#   docker compose down               停止（保留数据）
#   docker compose down -v            停止并删除数据卷
#
# ⚠️ 下面的账号密码是**本地开发专用**，刻意明文写死：
#   - 端口只绑 127.0.0.1，容器外的机器连不上
#   - 这个库里只有测试数据，没有任何真实内容
#   - 明文写死换来的是「clone 下来就能跑」，不必再猜密码（这正是本机原生
#     MySQL 密码遗忘之后促成 Docker 方案的原因）
# 真实部署时必须改用 secrets 或环境注入，不能沿用这里的值。

services:
  mysql:
    image: mysql:8.0.43
    # 固定小版本而不是 mysql:8.0 或 mysql:latest：
    # 浮动 tag 会让「上周还能跑」变成没法复现的故障。Step 9 的供应链要求
    # （增补 R-10）是镜像用不可变引用，这里先按同一纪律执行。
    container_name: codeinsight-mysql
    restart: unless-stopped
    ports:
      # 3307 而不是 3306：本机已有一个原生 MySQL 8.0.46 占着 3306。
      # 绑到 127.0.0.1 而不是 0.0.0.0——不给局域网暴露一个明文密码的数据库。
      - "127.0.0.1:3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: codeinsight-dev-root
      MYSQL_USER: codeinsight
      MYSQL_PASSWORD: codeinsight-dev
      # MYSQL_DATABASE 只能建一个库，而我们需要两个（应用库 + 测试库），
      # 所以两个库都由 init 脚本建，这里不设它，避免两处各建一半。
    command:
      # MySQL 8 的默认字符集已是 utf8mb4，但显式声明让它不依赖镜像默认值——
      # 换镜像版本时不会静默变回 latin1。
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 本机开发库，关掉 binlog 省一半磁盘写入。生产绝不能这么配。
      - --skip-log-bin
    volumes:
      - mysql-data:/var/lib/mysql
      # 只在数据目录为空（首次启动）时执行。改了脚本要 down -v 重建才生效。
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 有健康检查，`docker compose up --wait` 才能等到真正可连接再返回。
      # 没有它，容器"已启动"和 MySQL"能接受连接"之间有十几秒的空档，
      # CI 里就会随机出现连接失败。
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pcodeinsight-dev-root"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    # 使用本机已缓存的 digest，避免当前 Docker Hub TLS 问题阻断本地启动。
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    container_name: codeinsight-redis
    restart: unless-stopped
    ports:
      # 本机 6379 已有独立 Redis，项目容器使用 6380 避免互相覆盖。
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  qdrant:
    # Step 4 的本地 ANN 后端；digest 与当前已验证镜像一致，避免浮动 tag 漂移。
    image: qdrant/qdrant@sha256:0fb8897412abc81d1c0430a899b9a81eb8328aa634e7242d1bc804c1fe8fe863
    container_name: codeinsight-qdrant
    restart: unless-stopped
    ports:
      # Project-0009 占用 6333；008 固定使用 6335/6336，避免两个项目互相覆盖。
      - "127.0.0.1:6335:6333"
      - "127.0.0.1:6336:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    # 镜像不自带 wget/curl；由应用集成探针访问 /healthz，避免错误健康检查。

volumes:
  mysql-data:
    name: codeinsight-mysql-data
  qdrant-data:
    name: codeinsight-qdrant-data
    # 主 Compose 与旧兼容入口共享同一个数据卷；不让任一 Compose down -v 误删它。
    external: true
