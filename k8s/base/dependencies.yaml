apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: replace-in-local-secret
  MYSQL_PASSWORD: replace-in-local-secret
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    containers:
      - name: redis
        image: redis:7-alpine
        ports: [{name: redis, containerPort: 6379}]
        readinessProbe: {tcpSocket: {port: redis}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: qdrant}
spec:
  replicas: 1
  selector: {matchLabels: {app: qdrant}}
  template:
    metadata: {labels: {app: qdrant}}
    containers:
      - name: qdrant
        image: qdrant/qdrant:v1.15.5
        ports: [{name: http, containerPort: 6333}]
        readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: qdrant}
spec:
  selector: {app: qdrant}
  ports: [{name: http, port: 6333, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mysql}
spec:
  replicas: 1
  selector: {matchLabels: {app: mysql}}
  template:
    metadata: {labels: {app: mysql}}
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.43
          ports: [{name: mysql, containerPort: 3306}]
          env:
            - {name: MYSQL_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: mysql-credentials, key: MYSQL_ROOT_PASSWORD}}}
            - {name: MYSQL_DATABASE, value: codeinsight_v2}
            - {name: MYSQL_USER, value: codeinsight}
            - {name: MYSQL_PASSWORD, valueFrom: {secretKeyRef: {name: mysql-credentials, key: MYSQL_PASSWORD}}}
          readinessProbe: {tcpSocket: {port: mysql}, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: mysql}
spec:
  selector: {app: mysql}
  ports: [{name: mysql, port: 3306, targetPort: mysql}]
