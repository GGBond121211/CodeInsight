apiVersion: v1
kind: Namespace
metadata:
  name: codeinsight
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-proxy-config
data:
  nginx.conf: |
    events {}
    http {
      upstream gateways {
        server gateway-a:8010;
        server gateway-b:8010;
      }
      server {
        listen 8080;
        location = /health { return 200 '{"status":"ok"}'; }
        location /v1/ { proxy_pass http://gateways; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: codeinsight-api:2.0.1-local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "codeinsight.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: CODEINSIGHT_GATEWAY_FAKE_MODE, value: "1"}
            - {name: CODEINSIGHT_MYSQL_HOST, value: mysql}
            - {name: CODEINSIGHT_REDIS_URL, value: redis://redis:6379/0}
            - {name: CODEINSIGHT_CELERY_BROKER_URL, value: redis://redis:6379/1}
            - {name: CODEINSIGHT_CELERY_RESULT_BACKEND, value: redis://redis:6379/2}
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: {app: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-a
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway-a}}
  template:
    metadata: {labels: {app: gateway-a}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: gateway
          image: codeinsight-api:2.0.1-local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "codeinsight.infrastructure.gateway_server:app", "--host", "0.0.0.0", "--port", "8010"]
          ports: [{name: http, containerPort: 8010}]
          env: [{name: CODEINSIGHT_GATEWAY_FAKE_MODE, value: "1"}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: gateway-a}
spec:
  selector: {app: gateway-a}
  ports: [{name: http, port: 8010, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway-b}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway-b}}
  template:
    metadata: {labels: {app: gateway-b}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: gateway
          image: codeinsight-api:2.0.1-local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "codeinsight.infrastructure.gateway_server:app", "--host", "0.0.0.0", "--port", "8010"]
          ports: [{name: http, containerPort: 8010}]
          env: [{name: CODEINSIGHT_GATEWAY_FAKE_MODE, value: "1"}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: gateway-b}
spec:
  selector: {app: gateway-b}
  ports: [{name: http, port: 8010, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway-proxy}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway-proxy}}
  template:
    metadata: {labels: {app: gateway-proxy}}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf}]
      volumes: [{name: config, configMap: {name: gateway-proxy-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: gateway-proxy}
spec:
  selector: {app: gateway-proxy}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker}
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: worker
          image: codeinsight-api:2.0.1-local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "celery", "-A", "codeinsight.agent.worker_tasks.celery_app", "worker", "--pool=solo", "--loglevel=INFO"]
          env:
            - {name: CODEINSIGHT_CELERY_BROKER_URL, value: redis://redis:6379/1}
            - {name: CODEINSIGHT_CELERY_RESULT_BACKEND, value: redis://redis:6379/2}
