events {}

http {
  upstream codeinsight_gateways {
    least_conn;
    server gateway-a:8010 max_fails=2 fail_timeout=5s;
    server gateway-b:8010 max_fails=2 fail_timeout=5s;
  }

  server {
    listen 8080;
    location = /health {
      default_type application/json;
      return 200 '{"status":"ok","service":"gateway-proxy"}';
    }
    location /v1/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_connect_timeout 2s;
      proxy_read_timeout 65s;
      proxy_pass http://codeinsight_gateways;
    }
  }
}
