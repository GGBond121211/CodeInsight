# 候选模型登记
#
# 规则：
#   1. 未实际跑过的候选一律 status: pending，禁止把「计划测」写成「测过」。
#   2. 报告里必须写真实 provider / model 名称。Fake Provider 只用于证明故障
#      契约（超时、429、非法输出的处理），不得用于任何质量结论。
#   3. 没有原生 tool calling 的模型不能进入自主 Tool Loop 的 route profile。
#   4. 当前候选共享同一个 API 接入，只能证明模型级降级；独立 Provider
#      故障域在 G8-GW-08 完成前不得写成供应商容灾。

schema_version: 2
created_at: "2026-09-02"
updated_at: "2026-09-11"
price_version: "aliyun-maas-2026-09-11"
price_unit: "yuan_per_1m_tokens"

# ---------------------------------------------------------------------------
# 基线模型 —— 1.0 全部评测使用的组合。这一段是历史登记：1.0 的数字都来自
# deepseek-v4-flash 与旧 Frontier 端点，换模型后不能沿用。2.1.0 的运行时默认
# 已改为 qwen3.8-flash（见 routes / runtime_models）。
# ---------------------------------------------------------------------------
baseline:
  chat:
    model: "deepseek-v4-flash"
    role: "1.0 的 Router、回答生成、Critic-Reviser 全部使用"
    status: measured
    evidence: "Master-200、Fusion-131、Temporary-30 均基于此模型"
    known_characteristics:
      - "flash 级模型，成本低、速度快"
      - "1.0 未验证其原生 tool calling 能力（当时不需要）"
    caveat: >-
      代码不硬编码供应商。基线数字与此模型强绑定，换模型后
      Master-200 的 0.9150 不能直接沿用。

  embedding:
    model: "qwen3.7-text-embedding"
    role: "语义检索"
    status: measured
    evidence: "DEC-0021 的 v1 31 案评测；Master-200 沿用"
    known_characteristics:
      - "多语言，中文表现是 008 选它的原因"
    caveat: "未与其他 Embedding 模型做过对照（DEC-0034 列为 ❌ 未测）"

# ---------------------------------------------------------------------------
# 按场景划分的 route profile（2.0 Step 7）
#
# 不使用全局 fallback 链——不同场景对模型的要求不同。
# ---------------------------------------------------------------------------
route_profiles:
  - route: explain
    description: "解释代码、回答只读问题"
    requires_tool_calling: false
    requires_structured_output: true
    status: implemented
    primary: "qwen3.8-flash"
    fallback: ["qwen3.7-flash-2026-07-15"]

  - route: change-plan
    description: "生成 ChangePlan"
    requires_tool_calling: true
    requires_structured_output: true
    status: implemented
    primary: "qwen3.8-flash"
    fallback: ["qwen3.7-flash-2026-07-15"]
    note: "必须支持原生 tool_calls，不接受把工具调用伪装成文本 JSON"

  - route: patch
    description: "生成补丁"
    requires_tool_calling: true
    requires_structured_output: true
    status: implemented
    primary: "qwen3.8-flash"
    fallback: ["qwen3.7-flash-2026-07-15"]

  - route: patch-review
    description: "补丁审查 / 引用审查"
    requires_tool_calling: false
    requires_structured_output: true
    status: implemented
    primary: "qwen3.8-flash"
    fallback: ["qwen3.7-flash-2026-07-15"]

# ---------------------------------------------------------------------------
# 候选模型 —— 全部 pending，Step 8 才实际对照
# ---------------------------------------------------------------------------
candidates:
  chat:
    - id: baseline-flash
      model: "qwen3.8-flash"
      status: capability_smoke_passed_quality_unverified
      note: "当前默认模型，作为 A/B 的 baseline 组；只跑过能力 smoke，质量未对照"

    - id: superseded-deepseek-flash
      model: "deepseek-v4-flash"
      status: measured
      note: "1.0 与 2.0 的 baseline，2026-09-11 起不再是默认；旧报价（星星）与旧端点一起停用"

    - id: candidate-reasoning
      model: null
      status: pending
      selection_criteria:
        - "必须支持原生 tool_calls"
        - "必须支持 Structured Outputs 或稳定的 JSON Schema 约束"
        - "上下文长度 >= 当前 Context Budget 需求"
      note: >-
        具体型号待 Step 8 前根据预算与可用配额确定，现在不写死。
        写死一个没跑过的型号等于虚构事实。

  embedding:
    - id: baseline-qwen
      model: "qwen3.7-text-embedding"
      status: measured

    - id: candidate-qwen37-flash
      model: "qwen3.7-text-embedding-flash"
      status: pending
      dimension: 1024
      source: "https://help.aliyun.com/zh/model-studio/embedding-rerank-model/"

    - id: candidate-text-v4
      model: "text-embedding-v4"
      status: pending
      dimension: 1024
      source: "https://help.aliyun.com/zh/model-studio/embedding-rerank-model/"

    - id: candidate-text-v3
      model: "text-embedding-v3"
      status: pending
      dimension: 1024
      source: "https://help.aliyun.com/zh/model-studio/embedding-rerank-model/"

    - id: embedding-scope
      model: null
      status: scope_rule
      note: >-
        E06 对阿里云百炼官方当前列出的四个纯文本 Embedding 做对照，统一 1024 维；
        多模态 Embedding 因 008 没有图像/视频检索而排除。真实调用前必须提交预算并再次确认。

  rerank:
    - id: aliyun-qwen37-text-rerank
      model: "qwen3.7-text-rerank"
      status: capability_smoke_passed_quality_unverified
      role: "融合候选后的模型精排"
      key_source: "CODEINSIGHT_RERANK_API_KEY or CODEINSIGHT_EMBEDDING_API_KEY"
      base_url_source: "CODEINSIGHT_RERANK_BASE_URL or Embedding base URL converted to /compatible-api/v1"
      endpoint_suffix: "/reranks"
      max_documents: 500
      max_document_tokens: 30000
      source: "https://help.aliyun.com/zh/model-studio/embedding-rerank-model/"
      smoke_evidence: "2026-09-04: real minimal request returned HTTP 200 and results[].index/relevance_score"
      caveat: "接口能力已验证；尚未在项目评测集证明质量收益"

# ---------------------------------------------------------------------------
# Fake Provider —— 只用于故障契约，不产生质量结论
# ---------------------------------------------------------------------------
fake_provider:
  purpose: "注入 429 / 5xx / 超时 / 非法 tool 输出 / 非法 schema，验证 Gateway 行为"
  status: implemented
  hard_rule: >-
    Fake Provider 的任何输出都不得进入质量指标。它只回答
    「系统在故障下的行为是否正确」，不回答「答案好不好」。

# 价格口径：2026-09-11 起是用户在阿里云百炼控制台模型广场截图里的人民币报价
# （元/百万 token）。能力只登记截图明确标签或本项目真实 smoke 已证明的项，
# 没跑过的能力一律不写。
runtime_models:
  # 2026-09-11：随默认端点换成阿里云 MaaS，本表改用**人民币/百万 token**，
  # 价格来自用户在控制台模型广场的截图。旧的「星星」报价属于已停用的
  # Frontier 端点，留在 git 历史里，不与本表混用。
  # 本表是 backend/src/codeinsight/infrastructure/model_profiles.py 的镜像；
  # 两处不一致时以代码为准。
  - {model: "codex-auto-review", input: 1.75, output: 14, cached_input: 0.175, capabilities: [text]}
  - {model: "qwen3.8-flash", input: 0.8, output: 2.7, cached_input: 0.8, capabilities: [text, tools, structured_output], tier: best, default: true}
  - {model: "qwen3.7-flash-2026-07-15", input: 0.2, output: 0.8, cached_input: 0.2, capabilities: [text, tools, structured_output], fallback_eligible: true}
  - {model: "deepseek-v4-flash", input: 12, output: 36, cached_input: 0.3996, capabilities: [text, tools, structured_output]}
  - {model: "deepseek-v4-flash-vision-exp", input: 12, output: 36, cached_input: 0.3996, capabilities: [text, vision, reasoning, tools, structured_output]}
  - {model: "deepseek-v4-pro", input: 36, output: 108, cached_input: 1.1988, capabilities: [text]}
  - {model: "glm-5.2", input: 30, output: 105, cached_input: 7.5, capabilities: [text, reasoning, tools, structured_output]}
  - {model: "glm-5.2-fast-preview", input: 60, output: 210, cached_input: 15, capabilities: [text, reasoning, tools, structured_output]}
  - {model: "gpt-5.4", input: 2.5, output: 15, cached_input: 0.25, capabilities: [text, reasoning, tools, structured_output], fallback_eligible: true}
  - {model: "gpt-5.4-mini", input: 0.75, output: 4.5, cached_input: 0.075, capabilities: [text, reasoning, tools, structured_output], fallback_eligible: true}
  - {model: "gpt-5.5", input: 5, output: 30, cached_input: 0.5, capabilities: [text, reasoning, tools, structured_output]}
  - {model: "gpt-5.6-luna", input: 1.5, output: 12, cached_input: 0.18, capabilities: [text]}
  - {model: "gpt-5.6-sol", input: 5, output: 30, cached_input: 0.5, capabilities: [text]}
  - {model: "gpt-5.6-terra", input: 2.5, output: 20, cached_input: 0.3, capabilities: [text]}
  # cached_input 与 input 同价是**保守假设**（按不命中计价）：该中转站没有公开
  # 缓存计价，宁可高估成本也不把未证实的折扣写成事实。
  # smoke_verified: "2026-09-11: qwen3.8-flash 在真实端点上跑通工具调用与压缩；其余行只是登记，未逐个 smoke"
# ---------------------------------------------------------------------------
# 成本记账要求（增补 R-7）
# ---------------------------------------------------------------------------
cost_accounting:
  required_fields:
    - requestId
    - attemptId
    - tenantId
    - userId
    - scene
    - promptVersion
    - provider
    - modelTier
    - actualModel
    - inputTokens
    - outputTokens
    - cachedTokens
    - priceVersion
    - latencyMs
    - ttftMs
    - fallbackReason
    - errorClass
  note: >-
    priceVersion 不可省略。只存最终 cost，价格调整后就无法解释历史数据，
    也无法重新计费。
