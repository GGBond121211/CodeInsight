# 检索实验矩阵
#
# 核心纪律（来自 DECISIONS.md DEC-0033）：
#   1. 每次只改一个主要变量。同时改两个就无法归因。
#   2. 确定性实验只跑 1 Trial，且重跑必须逐位相同——不同就说明有未声明的
#      随机源，必须先找出来再继续。
#   3. 判据是 case-clustered bootstrap 95% CI，结论分四档：
#      PROVEN / DIRECTIONAL / NO_EFFECT / REGRESSION。
#   4. 硬门槛先于质量分。任一门槛不为 0，该候选直接淘汰，不看质量指标。

schema_version: 1
created_at: "2026-09-02"

# ---------------------------------------------------------------------------
# 实验分层 —— 决定 Trial 数与成本
# ---------------------------------------------------------------------------
experiment_tiers:
  deterministic:
    description: "向量固定后完全确定，同输入同输出"
    trials: 1
    verification: "重跑必须逐位相同"
    applies_to:
      - chunk 行数与 overlap
      - RRF K 与来源权重
      - semantic min_score
      - Top-K 与候选上限
      - HNSW 参数
      - Provider Dense/Sparse 对照（固定 chunk 与索引后）
    cost: "仅 Embedding 调用，无 Chat 调用"

  single_model_call:
    description: "单次模型调用，有采样随机性"
    trials: "3-5"
    applies_to:
      - Router 置信度门槛
      - 回答生成的 Prompt 变体
      - Reviewer
    judgement: "case-clustered bootstrap 95% CI"

  autonomous_tool_loop:
    description: "多步、误差累积，方差最大"
    trials: "5-10"
    applies_to:
      - Agent 最大步数
      - patch repair 次数
      - 端到端 change task
    judgement: "同上，并额外报告 wins/losses/ties 与 STUCK 率"

# ---------------------------------------------------------------------------
# 数据集分层（增补 R-12）
# ---------------------------------------------------------------------------
datasets:
  L0_master200:
    path: "backend/tests/evals/master_200_cases.json"
    size: 200
    role: "只读回归，防退化"
    cost: "零（已有结果可比对）"
    adopted: true

  L1_change_tasks:
    path: "backend/tests/evals/change_eval_manifest.json"
    size: 34
    role: "自建 change task，覆盖边界与攻击"
    statistical_power: "CI 半宽约 ±0.13，只能检出 13 个百分点以上的差异"
    adopted: true

  L2_swebench_localization:
    candidate_path: "backend/tests/evals/swebench_l2_subset.json"
    path: "backend/tests/evals/swebench_l2_frozen_80.json"
    source: "SWE-bench/SWE-bench_Verified（MIT）"
    candidate_size: 194
    size: 80
    fields_used: [problem_statement, patch, repo, base_commit]
    docker_required: false
    role: "外部可信基准，评故障定位与证据召回"
    adopted: true
    status: frozen
    split_counts: {dev: 20, regression: 20, golden: 20, holdout: 20}
    holdout_policy: "holdout 只在最终验证使用一次，调参期间禁止查看"
    selection_rule: "仓库配额 + difficulty 分层 + instance_id SHA-256 稳定排序"
    hard_gates:
      - out_of_scope_writes == 0
      - disallowed_commands == 0
      - original_repo_modifications == 0
      - invalid_evidence == 0
      - approval_bypass == 0
      - sandbox_escape == 0
      - repo_injection_violations == 0

  L3_swebench_execution:
    planned_size: "20-30"
    docker_required: true
    role: "Patch Apply Rate、Targeted Test Pass"
    adopted: false
    gate: "Step 6 Sandbox 与 Step 9 Compose 验收通过，且预算获批"

  L4_swebench_resolve:
    role: "resolve rate（次要指标，诚实报告）"
    adopted: false
    gate: "同 L3"

  L5_conversation_2_1_0:
    path: "backend/tests/evals/conversation_cases_2_1_0.json"
    size: 24
    turns: 123
    role: "同一 Session 的入口、上下文、范围引导、Evidence 回忆和审批边界"
    adopted: true
    quality_policy: "experiments/configs/dataset_quality_policy_2_1_0.yaml"
    split_manifest: "experiments/configs/experiment_splits_2_1_0.yaml"
    split_counts: {dev: 6, regression: 6, golden: 6, holdout: 6}
    holdout_policy: "holdout 只在参数和 Prompt 冻结后使用"
    quality_status: "READY_FOR_MODEL_PILOT"
    source_audit: "agent_review_only; not independent human double-blind"

# ---------------------------------------------------------------------------
# 实验队列 —— 按执行顺序排列
# ---------------------------------------------------------------------------
queue:

  - id: EXP-001
    name: "chunk 行数 × overlap 九格对照"
    amendment: "R-14①"
    tier: deterministic
    trials: 1
    schedule: "Step 1 完成后立即执行，Step 4 开始前必须完成"
    schedule_reason: >-
      不依赖任何 2.0 组件；成本极低；且 chunk 是后续所有实验的基线，
      不先定下来，Step 4 的索引改造就建立在一个没有依据的参数上。
    variables:
      chunk_max_lines: [40, 80, 120]
      chunk_overlap_ratio: [0.0, 0.10, 0.20]
    fixed:
      - "retriever = Provider Dense + Provider Sparse"
      - "rrf_k = 60"
      - "source_weights = {dense: 1.0, sparse: 1.0}"
      - "semantic_min_score = 0.20"
      - "dense_candidates = 40"
      - "sparse_candidates = 40"
      - "top_k = 10"
      - "embedding model = qwen3.7-text-embedding"
    datasets: [L0_master200]
    metrics:
      primary: [evidence_recall, complete_evidence_coverage]
      secondary: [citation_validity, citation_precision, avg_topk_context_lines]
      cost: [index_build_seconds, index_size_mb, embedding_tokens]
    hard_gates: [citation_validity == 1.0]
    answers_interview_question: "重叠窗口设了多少？为什么？"
    status: baseline_retest_required
    decision: >-
      2.1.0 基线确认当前正式入口仍运行 fixed_lines/80/0；structural_v1 是用户指定的
      未验证候选，只在独立实验中比较，不把历史用户选择写成运行时默认。

  - id: EXP-002
    name: "融合参数单变量扫描"
    amendment: "R-14②"
    tier: deterministic
    trials: 1
    schedule: "Step 8"
    depends_on: [EXP-001]
    depends_reason: "chunk 定下来才能固定其他变量"
    variables_one_at_a_time:
      rrf_k: [20, 60, 100]
      source_weight_dense: [1.0]
      source_weight_sparse: [1.0]
      semantic_min_score: [0.0, 0.20, 0.35]
    datasets: [L0_master200, L2_swebench_localization]
    metrics:
      primary: [evidence_recall, complete_evidence_coverage]
      secondary: [citation_precision]
    status: pending

  - id: EXP-003
    name: "Rerank 模型接口契约"
    amendment: "R-14③"
    tier: deterministic
    trials: 1
    schedule: "Step 8"
    depends_on: [EXP-001, EXP-002]
    variables:
      reranker_strategy: [aliyun_qwen37_text_rerank]
    metrics:
      primary: [response_index_mapping, score_parsing, failure_propagation]
      cost: [request_latency_ms, request_tokens]
    answers_interview_question: "模型 Rerank 的接口契约和失败行为是否可靠？"
    note: >-
      用户已固定使用 qwen3.7-text-rerank，并取消 none/deterministic/model 质量对照；
      只保留接口契约 smoke 与不回退错误测试，不从中推导质量收益。
    status: skipped_by_user_unverified
    decision: "必须启用模型 Rerank；固定 aliyun qwen3.7-text-rerank，不做质量三方对照"

  - id: EXP-004
    name: "候选池容量"
    tier: deterministic
    trials: 1
    schedule: "Step 8"
    variables:
      hybrid_candidate_limit: [100]
      final_top_k: [10]
    note: >-
      外部资料建议粗召回 30-100 条再 Rerank，当前 20 偏低。
      但候选越多 token 与重排成本越高，必须同时看代价。
    status: candidate_profile_pending
    baseline_control: {dense_candidate_limit: 40, sparse_candidate_limit: 40, hybrid_candidate_limit: 100, final_top_k: 10}
    user_candidate: {dense_candidate_limit: 40, sparse_candidate_limit: 40, hybrid_candidate_limit: 100, final_top_k: 10}
    hard_rule: "先固定 chunk、Embedding、融合与 Rerank；只改变 final_top_k，报告质量和 token/延迟代价"

  - id: EXP-005
    name: "Embedding 模型对照"
    tier: deterministic
    trials: 1
    schedule: "Step 8"
    depends_on: [EXP-001]
    depends_reason: "必须固定 chunk 与索引配置，只换模型"
    query_categories:
      - 中文自然语言问题
      - 英文 identifier 精确匹配
      - 路径与文件名
      - 错误信息片段
      - 中英混合 query
    models:
      - qwen3.7-text-embedding
      - qwen3.7-text-embedding-flash
      - text-embedding-v4
      - text-embedding-v3
    fixed_dimension: 1024
    exclusion: "多模态 Embedding 与 CodeInsight 纯文本检索业务不匹配，本轮不测"
    metrics:
      primary: [recall_at_k, mrr, citation_validity]
      cost: [dimensions, index_size_mb, build_seconds, p95_latency_ms]
    answers_interview_question: "为什么选这个 Embedding 模型？中文效果怎么样？"
    status: pending

  - id: EXP-006
    name: "Qdrant HNSW 参数契约"
    tier: deterministic
    trials: 1
    schedule: "Step 4 / Step 8"
    variables:
      hnsw_m: [8, 16, 32]
      hnsw_ef_construction: [64, 128, 256]
      hnsw_ef_search: [32, 64, 128]
    hard_gates:
      - "evidence ID 与行号在切换和回滚后完全不变"
    metrics:
      primary: [recall_at_k, mrr, citation_validity]
      cost: [p95_latency_ms, memory_mb, index_build_seconds]
    status: baseline_completed_parameter_scan_pending
    result: >-
      EXP-006 2026-09-04：Qdrant/HNSW baseline 为 M=16 /
      efConstruction=128 / efSearch=64；历史后端对照仅作为演进记录。

  - id: EXP-007
    name: "规模基准 ×1 vs ×10"
    amendment: "R-14④"
    tier: deterministic
    trials: 1
    schedule: "Step 8"
    scale_construction: "多仓库拼接，或 work/ 中已固定的三个真实仓库组合"
    metrics:
      - index_build_seconds
      - peak_memory_mb
      - index_size_mb
      - query_p95_latency_ms
      - recall_decay
      - backend_crossover_point
    required_conclusion_form: >-
      「当前方案的规模天花板在哪，到什么规模必须切换后端」
    answers_interview_question: "数据量扩大十倍以后你方案还能不能打？"
    status: skipped_by_user_unverified
    decision: "2026-09-04 用户决定暂不运行；不得给出 ×10 规模结论"

  - id: EXP-008
    name: "Query Rewrite 开关"
    tier: single_model_call
    trials: "3-5"
    schedule: "Step 8"
    variables:
      query_rewrite: [off, on]
    hard_rule: >-
      改写时必须保留原始 query，原始与改写一起召回后融合。
      只用改写后的 query 会在改写模型理解错意图时导致整轮召回全偏。
    metrics:
      primary: [evidence_recall]
      cost: [added_model_calls, added_latency_ms, added_tokens]
    status: blocked_not_implemented
    decision: "当前正式运行时未实现；先完成原始 query 保留、改写结果记录和失败回退，再做 off/on 对照"
    note: "旧的 on-only 记录与当前代码不一致，已降级为未来候选；不得表述为已启用或已证明收益"

  - id: EXP-009
    name: "独立多轮会话真实模型 pilot"
    amendment: "2.1.0 数据集合格化"
    tier: single_model_call
    trials: 3
    schedule: "Stage 0 数据准入通过后；参数实验前"
    dataset: L5_conversation_2_1_0
    allowed_splits: [dev, regression, golden]
    forbidden_splits: [holdout]
    fixed:
      - "同一 case 使用同一个 session_id"
      - "real provider only; Fake Provider 不进入质量指标"
      - "request-level output cap"
      - "max_retries = 0"
      - "不应用 change 轮的 source fixture"
    primary_metrics:
      - route_accuracy
      - goal_continuity
      - required_fact_recall
      - evidence_recall
      - approval_boundary_rate
    secondary_metrics:
      - compaction_count
      - session_restore_success
      - cache_hit_ratio
      - input_tokens
      - output_tokens
      - latency_p50_p95
    conclusion: "pilot/directional；holdout 和独立审查完成后才允许 final"
    status: ready_for_real_model_pilot

# ---------------------------------------------------------------------------
# 禁止事项
# ---------------------------------------------------------------------------
prohibitions:
  - "禁止在 holdout 上调参。holdout 只在最终验证时使用一次。"
  - "禁止一次改多个变量后声称某单一变量有效。"
  - "禁止用少量 Trial 的点估计冒充结论；预算不足时标 pending 并说明缺口。"
  - "禁止修改问题或期望证据来迎合排名（1.0 DEC-0012 已确立此纪律）。"
  - "禁止重跑多次后挑选好看的一次作为结果。"
  - "禁止把 Fake Provider 的输出用于任何质量结论。"
