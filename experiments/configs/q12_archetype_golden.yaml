# Q-012 C2.2：问题原型路由的标注集。
#
# holdout = 每个原型 10 条**没有出现在示例问题里**的问题，用来量命中率；
# negative = 12 条不该命中原型的问题，用来量错命中率。错命中比未命中危险，
# 所以 negative 的分量不比 holdout 轻。
#
# 标签是「人认为它属于哪一类问法」。有些问题（性能、设计、评价）本来就不属于
# 任何原型——它们该回退到 Tool Loop，而不是被硬塞进最近的一类。
#
# 评测对象：application.archetype_router.ArchetypeRouter（真实 Embedding，无对话模型调用）。

version: q012-archetype-golden-v1
library_version: q012-archetypes-v1
