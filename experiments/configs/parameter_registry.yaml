# 参数登记表
#
# 为什么需要这份文件：
#   Sandbox 的「默认无网络」和 chunk 的「80 行」在代码里都只是一个配置项，
#   但性质完全不同。没有这张表，某次为了「提升成功率」的实验可能顺手把沙箱
#   网络打开，7 条硬门槛就静默失效了。
#
#   这份文件的唯一职责，是把「可以调的」和「碰都不能碰的」分开。
#
# 四种分类：
#   tunable        可调。允许进入实验矩阵，但必须遵守 safety_ceiling。
#   fixed          本轮固定。不是安全约束，只是本阶段不动，改动需新决策记录。
#   hard_gate      安全门禁。任何实验都不得修改。改动必须先改 BOUNDARIES.md。
#   not_applicable 不适用于本项目范围。
#
# 每个当前值还必须有 evidence_status：
#   measured               有真实实验/运行结果支持
#   supported_by_contract  有代码契约和针对性测试支持，但不代表已调优
#   verified_runtime       已在真实运行链路触发，但不代表参数最优
#   pending                暂时默认值，尚无足够实验依据
#   not_implemented        只登记了未来需求，当前尚未实现
#   user_selected_unverified 用户直接固定但未做 A/B，不能作为最优性证据
#   incomplete_retest_required 历史结果口径不足，必须先复测
#   measured_unoptimized 已有测量，但没有参数优化对照
#   implemented_unoptimized 已实现并有契约，但尚未证明取值最优

schema_version: 1
created_at: "2026-09-02"
authority: "docs/RELEASE_2_1_0_Q1_Q5.md 的当前升级边界；历史 2.0 结果仍只作对照"
experiment_baseline: "experiments/configs/baseline_2_1_0.yaml"

# ===========================================================================
# hard_gate —— 安全门禁，实验不得触碰
# ===========================================================================
hard_gate:

  - name: evidence_id_mapping
    value: "application-side"
    unit: mode
    meaning: "模型只能返回 E 编号，真实路径与行号由应用代码映射"
    why_hard: >-
      这是 1.0 到 2.0 唯一不变的地基。让模型直接输出路径，
      整个项目的「可核验」卖点就没了。
    violation_metric: "无效 evidence 数必须为 0"

  - name: original_repo_write
    value: "forbidden"
    unit: mode
    meaning: "原始仓库默认只读，写只发生在隔离 workspace"
    why_hard: "用户的真实代码不能被 Agent 意外改动"
    violation_metric: "原仓库默认模式修改数必须为 0"

  - name: sandbox_network
    value: "none"
    unit: mode
    meaning: "Sandbox 默认无网络出口"
    why_hard: "有网络的沙箱等于没有沙箱，注入成功后可外传数据"
    violation_metric: "Sandbox escape 数必须为 0"

  - name: sandbox_user
    value: "non-root"
    unit: mode
    meaning: "容器内不以 root 运行"
    why_hard: "root 容器逃逸的后果远大于普通用户"

  - name: command_execution_policy
    value: "allowlist_only"
    unit: mode
    meaning: "只允许 validation profile 白名单内的命令，模型不能拼接任意 Shell"
    why_hard: >-
      黑名单永远拦不完。白名单是唯一可断言的方式。
    violation_metric: "未允许命令数必须为 0"

  - name: apply_requires_approval
    value: true
    unit: bool
    meaning: "应用补丁必须有一次性、过期、范围绑定的 approval token"
    why_hard: "无审批的自动写入，用户对 Agent 的行为失去最后一道控制"
    violation_metric: "approval bypass 数必须为 0"

  - name: path_containment
    value: "enforced"
    unit: mode
    meaning: "写入路径必须在 workspace 根目录内，含 symlink 解析后再校验"
    why_hard: "路径逃逸可写到 ~/.ssh、系统目录"
    violation_metric: "越界写入数必须为 0"

  - name: repo_content_trust_level
    value: "untrusted"
    unit: mode
    meaning: >-
      被分析仓库的全部内容（源码、注释、docstring、README、配置、文件名、
      路径）均为不可信数据，只进 Prompt 的 Evidence 分区并带不可信标记
    why_hard: >-
      008 的核心场景就是分析陌生仓库，攻击面即业务面。增补 R-2。
    violation_metric: "仓库注入导致的越界行为数必须为 0"

