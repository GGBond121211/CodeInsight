# ===========================================================================
# fixed —— 本轮固定，改动需新决策记录
# ===========================================================================
fixed:

  - name: line_numbering
    value: "1-based, inclusive"
    reason: "改动会使全部历史评测的行号期望失效"

  - name: chunking_version
    value: "fixed-lines-v1"
    reason: "索引身份的一部分；R-14① 若改变切块策略需升版并重建索引"

  - name: cache_schema_version
    value: 1
    reason: "manifest 格式版本，改动需处理旧缓存兼容"

  - name: model_max_retries
    value: 0
    reason: >-
      刻意不重试。重试会掩盖真实失败率，使评测里的错误统计失真。
      2.0 的重试逻辑归 Gateway 管，且必须按错误类型区分（DEC-0035）。

  - name: python_version
    value: ">=3.12,<3.14"

  - name: embedding_batch_size
    value: 16
    reason: "为绕过服务端单次输入上限而设，非调优结果；供应商变更时才重估"

# ===========================================================================
# not_applicable —— 不在本项目范围
# ===========================================================================
not_applicable:

  - name: quantization / vllm / inference_serving
    reason: "008 调用 OpenAI 兼容 API，不自部署模型"
    interview_note: "被问到时说明边界与若要做的思路，不硬答"

  - name: lora_rank / lora_alpha / sft_hyperparameters
    reason: "2.0 明确不做真实训练，Step 8 只做 schema、dry-run 与资源估算"
    interview_note: "同上"

  - name: multi_agent_communication_params
    reason: "2.0 明确不做 Multi-Agent swarm；原 Phase II 的单/多 Agent 对照须重新立项（DEC-0032）"

  - name: graphrag_params
    reason: "只有代码证据失败样本证明 RepositoryMap/RAG 不够时才讨论"
