# CodeInsight 2.1.0 实验基线
#
# 这是实验开始前的事实快照，不是参数最优结论。它把当前运行时代码、
# 用户指定候选和实验尚未决定的变量分开，防止把计划值误写成线上值。

schema_version: 1
baseline_id: "codeinsight-2.1.0-experiment-baseline-20260910"
version: "2.1.0"
status: frozen_for_experiment_setup
created_at: "2026-09-08"
updated_at: "2026-09-10"
supersedes: "codeinsight-2.1.0-experiment-baseline-20260908"

# 基线的每次事实变化在此留痕；旧值不静默覆盖。
revisions:
  - date: "2026-09-10"
    baseline_id: "codeinsight-2.1.0-experiment-baseline-20260910"
    changes:
      - "Q-003（用户决定，提交 a32782e）：public 搜索默认 final Top-K 由 5 改为 10；本文件把它从候选登记为 runtime_actual。10 相对 5 的收益仍未做 A/B。"
      - "Q-001（提交 8131e63）：temporary_30 清单的 primary_sparse_mode 由 ast-bm25/graph-bm25 改为 sparse；文件由 backend/tests/evals/build_temporary_30_ablation_manifest.py 重建后按新内容登记 sha256。"
    rule: "只登记已经发生的事实变化；这不是实验结果，也不把候选写成已验证的更优值。"

source:
  base_release: "v2.0.3"
  base_commit: "bf69022d63c74e0bf07ceaa12cf0bf002d269eca"
  base_ref: "origin/main"
  experiment_branch: "codex/2.1.0-development"
  rule: "每个实验必须保存本文件的快照；实验结果不得覆盖本文件。"

# 当前运行时事实：逐项以代码为准，不代表参数已经调优
runtime_actual:
  ingestion:
    chunking_strategy: "fixed_lines"
    chunk_max_lines: 80
    chunk_overlap_ratio: 0.0
    chunk_version: "fixed-lines-v1"
    line_numbering: "1-based-inclusive"
    source:
      strategy: "backend/src/codeinsight/application/search_repository.py:56"
      chunker: "backend/src/codeinsight/ingestion/chunker.py:11-12"
    structural_v1:
      status: "candidate_only"
      source: "backend/src/codeinsight/ingestion/structural_chunker.py"
      runtime_usage: "未被正式搜索入口调用；仅由结构切分评测脚本调用"

  retrieval:
    fusion:
      rrf_k: 60
      source_weights: {dense: 1.0, sparse: 1.0}
      source: "backend/src/codeinsight/retrieval/hybrid.py:11-14"
    hybrid_candidate_limit: 100
    default_final_top_k: 10
    default_final_top_k_note: "2026-09-10 起为运行时默认（Q-003 用户决定，提交 a32782e）；尚未用 A/B 证明 10 优于 5"
    source:
      candidate_limit: "backend/src/codeinsight/application/search_repository.py:35-37"
      default_top_k: "backend/src/codeinsight/application/search_repository.py:38；backend/src/codeinsight/application/auto_answer_repository.py:61"
    reranker:
      strategy: "aliyun_qwen37_text_rerank"
      status: "interface_smoke_passed_quality_unverified"
    semantic_min_score: 0.20

  context:
    max_input_tokens: 8000
    reserved_output_tokens: 1000
    source: "backend/src/codeinsight/application/context_assembler.py:46-47"
    token_estimator: "utf8_bytes_div_4"
    token_estimator_evidence_status: "pending_calibration"
    token_estimator_source: "backend/src/codeinsight/application/context_budget.py:16-24"

  query_rewrite:
    enabled: false
    status: "not_implemented_in_runtime"
    source_evidence: "当前 backend/src 与正式搜索入口没有 query rewrite 实现"
    experiment_gate: "先实现并单独验证，不能把配置文件中的 on 当成已接入"

  execution_safety:
    max_retries: 0
    original_repo_write: "forbidden"
    sandbox_network: "none"
    command_execution_policy: "allowlist_only"
    apply_requires_approval: true
    path_containment: "enforced"

# 控制组与用户候选：不能混写成当前值
experiment_profiles:
  control:
    id: "fixed-80-00-candidate-100-topk-5"
    owner: "experiment"
    source: "previous_runtime_default_before_20260910"
    chunking: "fixed_lines:80/0.0"
    hybrid_candidate_limit: 100
    final_top_k: 5
    purpose: "2.1.0 检索对照的值；2026-09-10 之前曾是运行时默认值"
  user_selected_candidate:
    id: "fixed-80-00-candidate-100-topk-10"
    owner: "user"
    status: "adopted_as_runtime_default_unvalidated"
    chunking: "fixed_lines:80/0.0"
    hybrid_candidate_limit: 100
    final_top_k: 10
    purpose: "用户在 2.0 阶段指定的 100/10；2026-09-10 由 Q-003 决定设为运行时默认"
    rule: "已是运行时默认值；仍必须做 5 vs 10 的 A/B，不得把默认值当成已验证的更优值"
  structural_candidate:
    id: "structural-v1"
    owner: "user_selected_candidate"
    status: "unverified_and_not_runtime_default"
    fallback: "fixed_lines:80/0.0"
    purpose: "单独验证结构边界是否改善证据质量，不能同时改变 Top-K 或 Embedding"

selection_ownership:
  project_hard_fixed:
    - evidence_id_mapping
    - original_repo_write
    - sandbox_network
    - sandbox_user
    - command_execution_policy
    - apply_requires_approval
    - path_containment
    - repo_content_trust_level
  user_selected_unverified:
    - "candidate_profile:fixed-80-00-candidate-100-topk-10"
    # 2026-09-10：Top-K=10 已成为运行时默认（Q-003），但仍未验证优于 5。
    - "candidate_profile:structural-v1"
    - "reranker:aliyun_qwen37_text_rerank"
  experiment_decided: []
  interpretation: "用户可以指定要比较的候选，但选了它不等于已经被实验证明更好。"

