    quality_status: "READY_FOR_MODEL_PILOT"
    source_audit: "agent_review_only"
    holdout_policy: "holdout 只在最终验证使用；不得用于调参"

dataset_quality:
  policy: "experiments/configs/dataset_quality_policy_2_1_0.yaml"
  split_manifest: "experiments/configs/experiment_splits_2_1_0.yaml"
  status: "conversation_dataset_ready_for_model_pilot"
  rule: "先通过自动结构/证据/指纹门禁，再允许真实模型 pilot；READY_FOR_FINAL 仍需独立复核"

# 指标契约：每个实验只能使用登记过的主指标和代价指标
metrics:
  evidence_recall:
    family: retrieval
    definition: "返回块覆盖期望 Evidence 行区间的比例"
    primary_for: [chunking, fusion, embedding, top_k]
  complete_evidence_coverage:
    family: retrieval
    definition: "全部期望 Evidence 区间都被完整覆盖的案例比例"
    primary_for: [chunking, fusion, embedding, top_k]
  citation_validity:
    family: grounding_gate
    definition: "引用映射到真实仓库路径和合法 1-based 行号"
    hard_gate: true
  citation_precision:
    family: retrieval
    definition: "返回引用中与期望 Evidence 相交的比例"
    primary_for: [fusion, rerank, top_k]
  mrr:
    family: retrieval
    definition: "第一个命中期望 Evidence 的倒数排名均值"
    primary_for: [embedding, vector_backend]
  answer_outcome_accuracy:
    family: answer_quality
    definition: "模型 outcome 与 expected outcome 一致的比例"
    caveat: "自动指标，不等价于人工确认的语义完全正确"
  token_usage:
    family: cost
    definition: "按 provider 返回的 input/output/cached/total usage 记录"
  latency:
    family: cost
    definition: "请求总耗时，按实验报告 P50/P95"
  change_task_success:
    family: change_quality
    definition: "补丁解析、审批、隔离校验和目标检查均满足的案例比例"
    hard_gates: [approval_bypass, sandbox_escape, original_repo_modifications]

metric_policy:
  aggregation: "先按 case，再按数据集分层；不同题型不得简单相加"
  hard_gates_before_quality: true
  bootstrap: "case-clustered bootstrap 95% CI when applicable"
  fake_provider: "只能证明故障契约，不进入质量指标"

# 已登记输入范围：没有写入范围的实验不得直接启动
experiment_input_ranges:
  chunking:
    values: {chunk_max_lines: [40, 80, 120], chunk_overlap_ratio: [0.0, 0.10, 0.20]}
    changed_variables: [chunk_max_lines, chunk_overlap_ratio]
    dataset: master_200
  fusion:
    one_variable_at_a_time:
      rrf_k: [20, 60, 100]
      source_weight_semantic: [0.5, 0.8, 1.0]
      semantic_min_score: [0.0, 0.20, 0.35]
    dataset: master_200
  candidate_and_top_k:
    control: {hybrid_candidate_limit: 100, final_top_k: 5}
    candidate: {hybrid_candidate_limit: 100, final_top_k: 10}
    dataset: master_200
  embedding:
    models: [qwen3.7-text-embedding, qwen3.7-text-embedding-flash, text-embedding-v4, text-embedding-v3]
    fixed_dimension: 1024
    dataset: master_200
  query_rewrite:
    values: [false, true]
    status: blocked_until_runtime_implementation
    dataset: master_200
  context_memory_gateway:
    status: range_not_frozen
    reason: "先完成真实 usage/延迟/质量校准，再登记预算、压缩和保留候选"

stop_conditions:
  - "本文件与实验运行时快照不一致"
  - "数据集路径、数量或 sha256 变化但未生成新 baseline_id"
  - "实验同时改变未登记变量"
  - "任一 hard gate 非零"
